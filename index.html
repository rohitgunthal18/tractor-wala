<style>
:root{
  /* The reference site ships no webfont for its chrome - it is pure system UI.
     Matched here rather than "improved", because the plain system stack is
     what gives that page its unbranded, utilitarian feel. */
  --ui: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  /* The Devanagari wordmark on the reference is outlined vector art with no
     font reference left in the file, so the original face is unrecoverable.
     This is the closest widely-available match; press F to cycle candidates. */
  --display: "Yatra One", "Baloo 2", "Mukta", "Anek Devanagari", "Noto Sans Devanagari", sans-serif;

  --fg: #fff;
  --dim: rgba(255,255,255,.62);
  --glass: rgba(255,255,255,.13);
  --glass-line: rgba(255,255,255,.17);
  --live: #35d16f;
  --pad: clamp(16px, 2.6vw, 40px);
  /* Shared by the docked player and the wordmark's keep-out margin, so the two
     can never drift out of agreement and overlap. */
  --playerW: min(444px, 38vw);
  --playerGap: clamp(18px, 3vw, 52px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--ui); color:var(--fg);
  background:#12180f; overflow:hidden;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
a{color:inherit; text-decoration:none}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer}
/* Resetting button chrome also removes the focus ring, which strands keyboard
   users with no visible caret. Put one back explicitly. */
:focus-visible{outline:2px solid #fff; outline-offset:3px; border-radius:4px}
#toggle:focus-visible{outline-color:#14180f; outline-offset:2px}

/* ---------------------------------------------------------------- backdrop */
#bg{position:fixed; inset:0; z-index:0; background:#12180f center/cover no-repeat}
#bg canvas{display:block; width:100%; height:100%}
/* Legibility scrims. Without these the clock and links dissolve into the
   bright sky the moment the canopy sways into that corner. */
#scrim{
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background:
    linear-gradient(to bottom, rgba(0,0,0,.42) 0%, rgba(0,0,0,.10) 18%, rgba(0,0,0,0) 34%),
    linear-gradient(to top,    rgba(0,0,0,.34) 0%, rgba(0,0,0,0) 30%);
}

/* ------------------------------------------------------------------ header */
header{
  position:fixed; z-index:3; top:0; left:0; right:0;
  padding:calc(var(--pad) * .72) var(--pad);
  padding-top:max(calc(var(--pad) * .72), env(safe-area-inset-top));
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  font-size:15px; font-weight:500; letter-spacing:.01em;
  text-shadow:0 1px 14px rgba(0,0,0,.5);
}
#clock{font-variant-numeric:tabular-nums; white-space:nowrap}
#clock .sep{animation:blink 2s steps(1,end) infinite}
@keyframes blink{0%,50%{opacity:1}51%,100%{opacity:.15}}

#online{
  position:absolute; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:8px; white-space:nowrap;
}
#online .dot{
  width:9px; height:9px; border-radius:50%; background:var(--live);
  box-shadow:0 0 0 0 rgba(53,209,111,.65); animation:pulse 2.4s ease-out infinite;
}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(53,209,111,.55)}
  70%{box-shadow:0 0 0 9px rgba(53,209,111,0)}
  100%{box-shadow:0 0 0 0 rgba(53,209,111,0)}
}
#online b{font-weight:600}

.links{display:flex; align-items:center; gap:clamp(14px,2vw,28px); margin-left:auto}
.links a{display:flex; align-items:center; gap:8px; opacity:.94; transition:opacity .18s}
.links a:hover{opacity:1}
.links svg.brand{width:19px; height:19px; flex:none}
.links .arw{width:11px; height:11px; opacity:.72; flex:none}

/* ---------------------------------------------------------------- wordmark */
/* Text sits near the top, horizontally centred. */
main{
  position:relative; z-index:2; height:100%;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  /* Clear the fixed header then add breathing room */
  padding-top:max(88px, calc(var(--pad) * 4.2));
  padding-left:var(--pad);
  padding-right:var(--pad);
  padding-bottom:0;
}
h1{
  margin:0;
  font-family:"Yatra One",sans-serif;
  font-weight:400;
  font-size:clamp(54px, 12vw, 140px);
  line-height:.92;
  white-space:nowrap;
  letter-spacing:0px; /* explicitly 0 to prevent Devanagari conjuncts breaking */
  font-variant-ligatures:normal;
  text-align:center;
  text-shadow:

    0 6px 32px rgba(0,0,0,.52),
    0 1px 4px  rgba(0,0,0,.38);
}

/* Desktop: reserve right column so player never overlaps h1 */
@media (min-width:1025px){
  main{
    /* Text now perfectly centered across entire screen */
  }
  h1{font-size:clamp(38px, 7.8vw, 132px)}
}

/* ------------------------------------------------------------------ player */
/* Desktop: parked in the open right-hand third of the painting, clear of the
   tractor. Mobile: returns to the reference's centred bottom dock. */
#player{
  position:fixed; z-index:4;
  right:var(--playerGap); top:50%; transform:translateY(-50%);
  width:var(--playerW);
  display:flex; align-items:center; gap:14px;
  padding:12px 16px 12px 12px; border-radius:999px;
  background:var(--glass); border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  backdrop-filter:blur(30px) saturate(150%);
  box-shadow:0 18px 50px rgba(0,0,0,.34);
}
#cover{
  width:62px; height:62px; flex:none; border-radius:50%; object-fit:cover;
  background:rgba(255,255,255,.1); box-shadow:0 3px 14px rgba(0,0,0,.36);
  animation:spin 22s linear infinite; animation-play-state:paused;
}
#player.playing #cover{animation-play-state:running}
@keyframes spin{to{transform:rotate(360deg)}}

.meta{flex:1; min-width:0}
#title{font-size:15px; font-weight:600; line-height:1.3; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#artist{font-size:13px; color:var(--dim); line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#bar{

  touch-action:none;
}
#bar .track{width:100%; height:3px; border-radius:3px; background:rgba(255,255,255,.26); overflow:hidden}
#bar .fill{height:100%; width:0; background:#fff; border-radius:3px}
#time{margin-top:3px; font-size:11.5px; color:var(--dim); font-variant-numeric:tabular-nums}

.controls{display:flex; align-items:center; gap:9px; flex:none}
.controls button{display:grid; place-items:center; border-radius:50%; transition:transform .14s, opacity .14s}
.controls button:active{transform:scale(.92)}
.skip{width:30px; height:30px; opacity:.86}
.skip:hover{opacity:1}
.skip svg{width:17px; height:17px}
#toggle{

  box-shadow:0 3px 14px rgba(0,0,0,.28);
}
#toggle svg{width:19px; height:19px}

#credit {
  position: absolute;
  bottom: 12px;
  right: 35px;
  font-size: 11.5px;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 4px;
  z-index: 10;
  opacity: 0.55;
  transition: opacity 0.2s, color 0.2s;
}
#credit:hover {
  color: #fff;
  opacity: 0.95;
}
#credit svg {
  width: 10px;
  height: 10px;
}

/* --------------------------------------------------------------- responsive */
@media (max-width:1024px){
  #player{
    right:auto; top:auto; left:50%; bottom:max(30px, env(safe-area-inset-bottom));
    transform:translateX(-50%);
    width:min(580px, calc(100vw - 28px));
  }
  #credit {
    right: auto;
    left: 50%;
    transform: translateX(-50%);
    bottom: 8px;
  }
}
@media (max-width:620px){
  header{font-size:13.5px}
  /* Absolute centring stops fitting once the clock and links grow toward the
     middle. Below this width the badge joins the flex row instead. */
  #online{position:static; transform:none; margin:0 auto}
  .links a span{
    position:absolute; width:1px; height:1px; overflow:hidden;
    clip:rect(0 0 0 0); clip-path:inset(50%); white-space:nowrap;
  }
  .links .arw{display:none}
  .links{gap:16px}
  .links svg.brand{width:22px; height:22px}
  #player{gap:11px; padding:10px 13px 10px 10px}
  #cover{width:54px; height:54px}
  #title{font-size:14px}
  #artist{font-size:12px}
  .controls{gap:5px}
  #toggle{width:43px; height:43px}
  .skip{width:27px; height:27px}
}
@media (max-width:400px){
  #online{font-size:12.5px}
  .skip{display:none}
}
@media (max-height:460px) and (orientation:landscape){
  h1{font-size:clamp(54px, 12vw, 90px)}
  #player{width:min(430px, 52vw)}
}
@media (prefers-reduced-motion:reduce){
  #cover, #online .dot, #clock .sep{animation:none}
  #notes-canvas{display:none}
}

[hidden]{display:none!important}

#notes-canvas{
  position:fixed; inset:0; z-index:2;

  width:100%; height:100%;
}
#loader {
  position:fixed; inset:0; z-index:9999;
  background:#1b2a17;
  display:flex; align-items:center; justify-content:center;
  transition:opacity .4s ease, visibility .4s ease;
}
#loader.fade-out {
  opacity:0; visibility:hidden;
}
.spinner {
  width:40px; height:40px;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:#fff; border-radius:50%;
  animation:spin .8s linear infinite;
}
</style>

<!-- ------------------------------------------------------------- background -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
varying vec2 vUv;
void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<script id="fs" type="x-shader/x-fragment">
precision highp float;
varying vec2 vUv;
uniform sampler2D uBase, uMask1, uMask2;
uniform vec2  uRes, uCover, uFocal, uSpk;
uniform float uTime, uWind, uBeat;

float hash21(vec2 p){
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1,0)), f.x),
             mix(hash21(i + vec2(0,1)), hash21(i + vec2(1,1)), f.x), f.y);
}
float fbm(vec2 p){
  float s = 0.0, a = 0.5;
  for(int i = 0; i < 4; i++){ s += a * vnoise(p); p *= 2.03; a *= 0.5; }
  return s;
}

void main(){
  // CSS `background-size: cover` has no shader equivalent - the crop has to be
  // applied to the sampling coordinate, around a focal point kept slightly
  // left of centre so a portrait phone still frames the tractor and the man.
  vec2 uv = (vUv - 0.5) * uCover + uFocal;
  if(uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0){
    gl_FragColor = vec4(0.07, 0.09, 0.06, 1.0); return;
  }

  vec4 m1 = texture2D(uMask1, uv);
  vec4 m2 = texture2D(uMask2, uv);
  vec2 texel = 1.0 / uRes;
  float t = uTime;

  float gust = mix(1.0, 0.52 + 0.48 * fbm(vec2(t * 0.055, 11.3)), 0.85);
  vec2 disp = vec2(0.0);

  float c1 = fbm(uv * vec2(3.0, 5.0) + vec2(t * 0.19, t * 0.07));
  float c2 = fbm(uv * vec2(8.0, 11.0) - vec2(t * 0.31, t * 0.13));
  float cs = sin(uv.x * 6.0 + uv.y * 3.0 - t * 0.85);
  disp += vec2((c1 - 0.5) * 1.7 + cs * 0.50 + (c2 - 0.5) * 0.8,
               (c2 - 0.5) * 0.9 + cs * 0.18) * m1.r * uWind * 5.2 * gust;

  float ph = fbm(uv * 3.0) * 6.2832;
  float wv = sin(uv.x * 26.0 - t * 1.35 + ph) * 0.55
           + sin(uv.x * 11.0 - t * 0.72 + ph * 0.5) * 0.45;
  disp += vec2(wv, -abs(wv) * 0.16) * m1.g * uWind * 4.0 * gust * (1.0 - m2.a * 0.62);

  float gph = fbm(uv * 9.0) * 6.2832;
  float gv = sin(uv.x * 44.0 - t * 2.60 + gph) * 0.6
           + (fbm(uv * 14.0 + vec2(t * 0.9, 0.0)) - 0.5) * 1.2;
  disp += vec2(gv, -abs(gv) * 0.20) * m1.b * uWind * 3.0 * gust;

  float k1 = fbm(uv * 1.6 + vec2(t * 0.021, t * 0.008));
  float k2 = fbm(uv * 2.9 - vec2(t * 0.013, 0.0));
  disp += vec2((k1 - 0.5) * 2.0 + sin(t * 0.045) * 0.6, (k2 - 0.5) * 0.7) * m1.a * uWind * 2.6;

  float br = sin(t * 1.45);
  disp += vec2(br * 0.25, -br * 0.75 - 0.35) * m2.b * 1.6;

  float hs = sin(uv.y * 260.0 + t * 3.1) * 0.6
           + (fbm(uv * vec2(6.0, 40.0) + vec2(0.0, t * 1.4)) - 0.5);
  disp += vec2(hs, 0.0) * m2.g * 1.3;

  /* ── speaker vibration (displacement) ───────────────────────────────── */
  float sdx = (uv.x - uSpk.x) * uRes.x / 22.0;
  float sdy = (uv.y - uSpk.y) * uRes.y / 22.0;
  float spkMask = exp(-(sdx*sdx + sdy*sdy));
  float beat = uBeat;
  float bpulse = sin(t * 28.0 + length(uv - uSpk) * 180.0) * 0.5 + 0.5;
  vec2 spkDir = normalize(uv - uSpk + vec2(0.001));
  disp += spkDir * spkMask * beat * bpulse * 2.8;

  vec2 suv = clamp(uv + disp * texel, vec2(0.0015), vec2(0.9985));
  vec3 col = texture2D(uBase, suv).rgb;

  float dp  = fbm(uv * vec2(4.5, 6.0) + vec2(t * 0.045, t * 0.021) + (c1 - 0.5) * 0.25);
  float dp2 = fbm(uv * vec2(11.0, 13.0) - vec2(t * 0.070, t * 0.030));
  float d = smoothstep(0.34, 0.72, dp * 0.68 + dp2 * 0.32);
  float amt = m2.r;
  col *= mix(1.0, mix(0.87, 1.12, d), amt);
  col = mix(col, col * vec3(1.06, 1.01, 0.92), amt * d * 0.65);
  col = mix(col, col * vec3(0.94, 0.97, 1.07), amt * (1.0 - d) * 0.45);

  float dust = 0.0;
  for(int i = 0; i < 8; i++){
    float fi = float(i);
    vec2 sd = vec2(fi * 13.7, fi * 7.3);
    vec2 pp = vec2(fract(hash21(sd + 1.0) + t * (0.020 + hash21(sd) * 0.030) * 0.35),
                   fract(hash21(sd + 2.0) + t * 0.006 + sin(t * 0.2 + fi) * 0.02));
    dust += smoothstep(0.0055, 0.0, length((uv - pp) * vec2(uRes.x / uRes.y, 1.0)))
          * (0.4 + 0.6 * hash21(sd + 3.0));
  }
  col += dust * 0.45 * m2.r * (0.35 + 0.65 * d);
  /* ── speaker vibration (brightness flash) ───────────────────────────── */
  col = mix(col, col * 1.25, spkMask * beat * 0.25);

  /* ── dotted noise / film grain ──────────────────────────────────────── */
  // Generates pixel-perfect, static high-frequency noise
  float noise = fract(sin(dot(uv * uRes, vec2(12.9898, 78.233))) * 43758.5453);
  col -= noise * 0.08; // Subtracting noise creates subtle dark dots across the image

  gl_FragColor = vec4(col, 1.0);
}
</script>

const FOCAL = 0.30;

   The reference logo is outlined vector art, so its true font cannot be read
   back out of the file; these are the closest available matches. */
const FONTS = [
  '"Yatra One", sans-serif',
  '"Baloo Bhai 2", sans-serif',
  '"Mukta", sans-serif',
  '"Anek Devanagari", sans-serif',
  '"Rozha One", serif',
  '"Tiro Devanagari Hindi", serif',
];

/* ═══════════════════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);

/* ------------------------------------------------------------------- clock */
(function clock(){
  const el = $("clock");
  const tick = () => {
    const d = new Date();
    let h = d.getHours();
    const ampm = h < 12 ? "am" : "pm";
    h = h % 12 || 12;
    const m = String(d.getMinutes()).padStart(2, "0");
    el.innerHTML = `${h}<span class="sep">:</span>${m} ${ampm}`;
    // Re-arm for the next minute boundary rather than a fixed interval: a
    // plain setInterval leaves the display up to its own period out of date,
    // and drifts further every time the tab is throttled in the background.
    setTimeout(tick, 60000 - (d.getSeconds() * 1000 + d.getMilliseconds()) + 40);
  };
  tick();
})();

/* ------------------------------------------------------------------ online */
/* Local simulation only. A real presence count needs a server (WebSocket or
   SSE) holding the connection list — there is no way to know how many other
   people have this page open from inside the page itself. */
(function online(){
  const el = $("count");
  const h = new Date().getHours();
  // Loosely diurnal: quiet overnight, busiest mid-evening.
  const base = 6 + Math.round(26 * Math.max(0, Math.sin((h - 5) / 19 * Math.PI)));
  let n = base + Math.floor(Math.random() * 5);
  el.textContent = n;
  setInterval(() => {
    n = Math.max(1, n + (Math.random() < 0.5 ? -1 : 1) * (Math.random() < 0.75 ? 1 : 2));
    n = Math.min(n, base + 12);
    el.textContent = n;
  }, 9000 + Math.random() * 7000);
})();

$("lnSpotify").href = LINKS.spotify;
$("lnYt").href = LINKS.ytmusic;

/* ------------------------------------------------------------------ player */
(function player(){
  const audio = $("audio"), box = $("player");
  const cover = $("cover"), thumb = $("cover-thumb"), title = $("title"), artist = $("artist");
  const bar = $("bar"), fill = bar.querySelector(".fill"), time = $("time");
  const icPlay = $("icPlay"), icPause = $("icPause"), toggle = $("toggle");
  let i = 0, seeking = false, token = 0;

  const fmt = s => (!isFinite(s) || s < 0)
    ? "0:00"
    : `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;

  function load(n, autoplay){
    i = (n + TRACKS.length) % TRACKS.length;
    const t = TRACKS[i];
    // Rapid next/next/next: each play() is async, so a rejection from a track
    // we have already moved past must not clear the state of the current one.
    const mine = ++token;
    title.textContent = t.title;
    artist.textContent = t.artist;   // also clears any stale error message
    thumb.setAttribute("href", t.cover || "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='36' height='36' viewBox='0 0 36 36'><rect width='36' height='36' fill='%231a1a1a'/></svg>");
    audio.src = t.src.split('/').map(p => encodeURIComponent(p)).join('/');
    fill.style.width = "0%";
    bar.setAttribute("aria-valuenow", 0);
    time.textContent = "0:00 / 0:00";
    if(autoplay){
      audio.play().catch(() => { if(mine === token) setPlaying(false); });
    }
  }

  function setPlaying(on){
    box.classList.toggle("playing", on);
    icPlay.style.display = on ? "none" : "block";
    icPause.style.display = on ? "block" : "none";
    toggle.setAttribute("aria-label", on ? "Pause" : "Play");
  }

  toggle.addEventListener("click", () => {
    const mine = token;
    if(audio.paused) audio.play().catch(() => { if(mine === token) setPlaying(false); });
    else audio.pause();
  });
  $("prev").addEventListener("click", () => {
    // Standard behaviour: restart the current track unless already near its start.
    if(audio.currentTime > 3) audio.currentTime = 0;
    else load(i - 1, !audio.paused);
  });
  $("next").addEventListener("click", () => load(i + 1, !audio.paused));

  audio.addEventListener("play",  () => setPlaying(true));
  audio.addEventListener("pause", () => setPlaying(false));
  audio.addEventListener("ended", () => load(i + 1, true));
  audio.addEventListener("error", () => {
    // A 404 on a track we have already skipped past must not stamp an error
    // over the track that is now playing fine.
    if(!audio.src || audio.src === location.href) return;
    setPlaying(false);
    artist.textContent = "ट्रॅक लोड होऊ शकला नाही";
  });
  audio.addEventListener("loadedmetadata", () => {
    time.textContent = `0:00 / ${fmt(audio.duration)}`;
  });
  audio.addEventListener("timeupdate", () => {
    if(seeking || !audio.duration || !isFinite(audio.duration)) return;
    const p = audio.currentTime / audio.duration;
    fill.style.width = (p * 100).toFixed(2) + "%";
    bar.setAttribute("aria-valuenow", Math.round(p * 100));
    // Screen readers read valuetext in preference to the bare percentage,
    // and "1:12 of 3:40" is far more useful than "33".
    bar.setAttribute("aria-valuetext", `${fmt(audio.currentTime)} of ${fmt(audio.duration)}`);
    time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
  });

  // Seeking: pointer events cover mouse, touch and pen in one path.
  // Duration is Infinity for a stream and NaN before metadata arrives; either
  // one turns the seek target into a non-finite currentTime, which throws.
  const seekable = () => audio.duration > 0 && isFinite(audio.duration);
  const seek = e => {
    const r = bar.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    fill.style.width = (p * 100).toFixed(2) + "%";
    if(seekable()){
      audio.currentTime = p * audio.duration;
      time.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
    }
  };
  bar.addEventListener("pointerdown", e => { seeking = true; bar.setPointerCapture(e.pointerId); seek(e); });
  bar.addEventListener("pointermove", e => { if(seeking) seek(e); });
  // pointercancel fires instead of pointerup when the gesture is stolen (a
  // browser scroll takeover on touch). Without it, `seeking` sticks true and
  // the progress bar freezes for the rest of the session.
  ["pointerup", "pointercancel"].forEach(ev =>
    bar.addEventListener(ev, e => {
      seeking = false;
      if(bar.hasPointerCapture(e.pointerId)) bar.releasePointerCapture(e.pointerId);
    }));
  bar.addEventListener("keydown", e => {
    if(!seekable()) return;
    const d = audio.duration;
    const to = v => { audio.currentTime = Math.min(d, Math.max(0, v)); };
    switch(e.key){
      case "ArrowRight": case "ArrowUp":   to(audio.currentTime + 5); break;
      case "ArrowLeft":  case "ArrowDown": to(audio.currentTime - 5); break;
      case "PageUp":   to(audio.currentTime + 30); break;
      case "PageDown": to(audio.currentTime - 30); break;
      case "Home": to(0); break;
      case "End":  to(d); break;
      default: return;
    }
    e.preventDefault();
  });

  addEventListener("keydown", e => {
    // e.target is not guaranteed to be an Element (it can be `document`), so
    // closest() cannot be called blind.
    const el = e.target instanceof Element ? e.target : null;
    if(el && el.closest("input, textarea, [contenteditable]")) return;
    if(e.metaKey || e.ctrlKey || e.altKey) return;   // leave browser shortcuts alone

    if(e.code === "Space"){
      // A focused button already activates on Space by itself. Handling it here
      // too would toggle twice and look like nothing happened.
      if(el && el.closest("button, a")) return;
      e.preventDefault();
      toggle.click();
    }
    if(e.key === "f" || e.key === "F"){
      const h1 = document.querySelector("h1");
      // indexOf is -1 before the first press; start at 1 so that press
      // actually changes something rather than re-applying the CSS default.
      const cur = FONTS.indexOf(h1.style.fontFamily);
      h1.style.fontFamily = FONTS[cur < 0 ? 1 : (cur + 1) % FONTS.length];
    }
  });

  setPlaying(false);
  load(0, false);
})();

/* -------------------------------------------------------------- background */
(function background(){
  const BASE = "assets/base.jpg";
  const NAT = { w: 1672, h: 941 };
  const bg = $("bg"), canvas = $("gl");

  // Static fallback the moment anything below is unavailable or fails.
  const fallback = () => {
    canvas.remove();
    bg.style.backgroundImage = `url("${BASE}")`;
    bg.style.backgroundPosition = `${FOCAL * 100}% center`;
    const loader = $("loader");
    if(loader) {
      loader.classList.add("fade-out");
      setTimeout(() => loader.remove(), 400);
    }
  };

  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(WIND <= 0 || reduced) return fallback();

  const gl = canvas.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if(!gl) return fallback();

  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if(!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };

  let prog;
  try {
    prog = gl.createProgram();
    gl.attachShader(prog, compile(gl.VERTEX_SHADER, $("vs").textContent));
    gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, $("fs").textContent));
    gl.linkProgram(prog);
    if(!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  } catch (err) { console.error(err); return fallback(); }
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ["uRes","uCover","uFocal","uTime","uWind","uBeat","uSpk","uBase","uMask1","uMask2"]
    .forEach(n => U[n] = gl.getUniformLocation(prog, n));

  const load = src => new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("image load failed: " + src.slice(0, 40)));
    im.src = src;
  });

  Promise.all([load(BASE), load(M1), load(M2)]).then(imgs => {
    imgs.forEach((im, u) => {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + u);
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, im);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    });
    gl.uniform1i(U.uBase, 0); gl.uniform1i(U.uMask1, 1); gl.uniform1i(U.uMask2, 2);
    gl.uniform2f(U.uRes, NAT.w, NAT.h);
    gl.uniform1f(U.uWind, WIND);
    gl.uniform2f(U.uSpk, 0.19, 0.52);  // speaker position in image coords
    const loader = $("loader");
    if(loader) {
      loader.classList.add("fade-out");
      setTimeout(() => loader.remove(), 400);
    }

    function resize(){
      // Capped DPR: this shader is fill-rate bound, and a 3x retina phone
      // would otherwise shade ~9x the pixels for no visible gain.
      const dpr = Math.min(devicePixelRatio || 1, 1.75);
      const w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
      if(canvas.width !== w || canvas.height !== h){
        canvas.width = w; canvas.height = h;
        gl.viewport(0, 0, w, h);
      }
      const view = innerWidth / innerHeight, img = NAT.w / NAT.h;
      // cover: overflow on whichever axis is proportionally longer
      const c = view > img ? [1, img / view] : [view / img, 1];
      gl.uniform2f(U.uCover, c[0], c[1]);
      // Keep the focal point from pushing the crop past the artwork's edge.
      const fx = Math.min(1 - c[0] / 2, Math.max(c[0] / 2, FOCAL));
      gl.uniform2f(U.uFocal, fx, 0.5);
    }
    addEventListener("resize", resize, { passive: true });
    resize();

    let t = 0, last = performance.now(), visible = true;
    document.addEventListener("visibilitychange", () => {
      visible = !document.hidden;
      last = performance.now();
    });
    (function frame(now){
      requestAnimationFrame(frame);
      const dt = Math.min((now - last) / 1000, 0.1);
      last = now;
      if(!visible) return;           // don't burn battery in a background tab
      t += dt;
      gl.uniform1f(U.uTime, t);
      gl.uniform1f(U.uBeat, window.__audioAmplitude || 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    })(last);
  }).catch(err => { console.error(err); fallback(); });
})();

/* ═══════════════════════════════════════════════════════════════════════════
   FLOATING MUSIC NOTES — rhythm-reactive, driven by Web Audio AnalyserNode
   ═══════════════════════════════════════════════════════════════════════════ */
(function musicNotes(){
  "use strict";

  const SPK_IX = 0.19, SPK_IY = 0.48;
  const NAT_W = 1456, NAT_H = 816;
  const FOCAL_X = 0.30;

  const cvs = document.getElementById("notes-canvas");
  const ctx = cvs.getContext("2d");
  let W = 0, H = 0;

  function resize(){
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = Math.round(innerWidth * dpr);
    H = Math.round(innerHeight * dpr);
    cvs.width = W; cvs.height = H;
    ctx.scale(dpr, dpr);
    W = innerWidth; H = innerHeight;
  }
  addEventListener("resize", resize, { passive: true });
  resize();

  function speakerScreen(){
    const view = innerWidth / innerHeight;
    const img  = NAT_W / NAT_H;
    const cx = view > img ? 1 : view / img;
    const cy = view > img ? img / view : 1;
    const fx = Math.min(1 - cx/2, Math.max(cx/2, FOCAL_X));
    const vx = (SPK_IX - fx) / cx + 0.5;
    const vy = (SPK_IY - 0.5) / cy + 0.5;
    return { x: vx * innerWidth, y: vy * innerHeight };
  }

  /* ── Web Audio API analyser ─────────────────────────────────────────── */
  const audioEl = document.getElementById("audio");
  let actx = null, analyser = null, freqData = null, connected = false;

  function ensureAnalyser(){
    if(connected) return;
    try {
      // Browsers block Web Audio media element connections on file:// protocol (silencing output).
      // We check if running locally and bypass routing if so, ensuring audio remains audible.
      if (window.location.protocol === "file:") {
        console.warn("Running on file:// protocol. Bypassing AudioContext link to ensure sound is audible.");
        connected = true;
        return;
      }

      actx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = actx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      freqData = new Uint8Array(analyser.frequencyBinCount);
      const src = actx.createMediaElementSource(audioEl);
      src.connect(analyser);
      analyser.connect(actx.destination);
      connected = true;
    } catch(e){ console.warn("Audio analyser unavailable:", e); }
  }

  function getAmplitude(){
    if(!analyser) {
      // Simulate real-time rhythm for file:// protocol so speaker and notes still dance
      if (playing) {
        const t = performance.now() * 0.006;
        const pulse = 0.15 + Math.sin(t * 1.8) * 0.1;
        const kick = Math.max(0, Math.sin(t * 4.2) * 0.38 + (Math.random() - 0.5) * 0.15);
        return Math.min(1, pulse + kick);
      }
      return 0;
    }
    analyser.getByteFrequencyData(freqData);
    let sum = 0, count = 0;
    const bassEnd = Math.floor(freqData.length * 0.4);
    for(let i = 0; i < bassEnd; i++){
      const w = 1.0 - (i / bassEnd) * 0.6;
      sum += freqData[i] * w;
      count += w;
    }
    return Math.min(1, (sum / count) / 180);
  }

  /* ── note particle ──────────────────────────────────────────────────── */
  const GLYPHS = ["\u266A","\u266B","\u266C","\u2669"];

  class Note {
    constructor(sx, sy, amp){
      this.x    = sx + (Math.random() - 0.5) * 16;
      this.y    = sy;
      this.vy   = -(0.5 + Math.random() * 0.4 + amp * 0.4);
      this.vx   = (Math.random() - 0.5) * 0.3;
      this.life = 0;
      this.maxL = 120 + Math.random() * 50;
      this.size = 13 + Math.random() * 10 + amp * 6;
      this.rot  = (Math.random() - 0.5) * 0.4;
      this.type = Math.random() < 0.75 ? "glyph" : "wave";
      this.glyph = GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
      this.wobble = Math.random() * Math.PI * 2;
      this.wobbleSpeed = 0.025 + Math.random() * 0.025;
    }

    update(){
      this.life++;
      this.wobble += this.wobbleSpeed;
      this.x += this.vx + Math.sin(this.wobble) * 0.4;
      this.y += this.vy;
      this.vy *= 0.995;
    }

    get alpha(){
      const p = this.life / this.maxL;
      if(p < 0.10) return p / 0.10;
      if(p > 0.55) return 1 - (p - 0.55) / 0.45;
      return 1;
    }

    draw(ctx){
      const a = this.alpha;
      if(a <= 0) return;
      ctx.save();
      ctx.globalAlpha = a * 0.45;
      ctx.translate(this.x, this.y);
      ctx.rotate(this.rot);

      if(this.type === "glyph"){
        ctx.font = `bold ${this.size}px system-ui,sans-serif`;
        ctx.fillStyle = "rgba(0,0,0,0.85)";
        ctx.strokeStyle = "rgba(255,255,255,0.35)";
        ctx.lineWidth = this.size * 0.08;
        ctx.lineJoin  = "round";
        ctx.strokeText(this.glyph, 0, 0);
        ctx.fillText(this.glyph, 0, 0);
      } else {
        ctx.strokeStyle = "rgba(0,0,0,0.75)";
        ctx.shadowColor = "rgba(255,255,255,0.3)";
        ctx.shadowBlur  = 3;
        ctx.lineCap = "round";
        for(let r = 0; r < 3; r++){
          const rad = (this.size * 0.35) + r * (this.size * 0.3);
          ctx.lineWidth = this.size * 0.09 - r * 0.01 * this.size;
          ctx.beginPath();
          ctx.arc(0, 0, rad, -Math.PI * 0.65, -Math.PI * 0.05);
          ctx.stroke();
        }
      }
      ctx.restore();
    }

    get dead(){ return this.life >= this.maxL; }
  }

  /* ── particle pool with rhythm-driven spawn ────────────────────────── */
  let notes      = [];
  let playing    = false;
  let frameId    = null;
  let spawnAccum = 0;

  function spawn(amp){
    const sp = speakerScreen();
    notes.push(new Note(sp.x, sp.y, amp));
  }

  function tick(){
    ctx.clearRect(0, 0, W, H);

    const amp = getAmplitude();
    window.__audioAmplitude = amp;

    if(playing){
      const rate = 0.008 + amp * 0.038;
      spawnAccum += rate;
      while(spawnAccum >= 1){
        spawn(amp);
        spawnAccum -= 1;
      }
    } else {
      window.__audioAmplitude = 0;
    }

    notes.forEach(n => { n.update(); n.draw(ctx); });
    notes = notes.filter(n => !n.dead);

    if(playing || notes.length > 0){
      frameId = requestAnimationFrame(tick);
    } else {
      frameId = null;
      window.__audioAmplitude = 0;
    }
  }

  function startNotes(){
    if(playing) return;
    ensureAnalyser();
    if(actx && actx.state === "suspended") actx.resume();
    playing = true;
    spawnAccum = 0;
    if(!frameId) frameId = requestAnimationFrame(tick);
  }

  function stopNotes(){
    playing = false;
  }

  audioEl.addEventListener("play",  startNotes);
  audioEl.addEventListener("pause", stopNotes);
  audioEl.addEventListener("ended", stopNotes);
  if(!audioEl.paused) startNotes();

})();

</script>
